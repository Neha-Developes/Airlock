services:
  - type: web
    name: airlock
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m airlock.server
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_API_KEY
        sync: false
      # NVIDIA Configuration (alternative):
      # - key: LLM_PROVIDER
      #   value: nvidia
      # - key: NVIDIA_BASE_URL
      #   value: https://integrate.api.nvidia.com/v1
      # - key: NVIDIA_MODEL
      #   value: nvidia/nemotron-3-super-120b-a12b
      # - key: NVIDIA_API_KEY
      #   sync: false
